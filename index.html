<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نسا سلیمانی | متخصص رایانش ابری</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            font-family: Tahoma, Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        .card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }
    </style>
</head>

<body>

    <main class="card">
        <img
            src="kartbord.jpg"
            alt="کارت معرفی نسا سلیمانی، متخصص رایانش ابری"
        >
    </main>

</body>
</html>
